name: Execute design-workflow remote command

on:
  workflow_call:

permissions:
  contents: write
  issues: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: design-workflow-remote-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out pinned remote bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _design_workflow_bridge
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate remote command request
        id: prepare
        continue-on-error: true
        run: >-
          node "$GITHUB_WORKSPACE/_design_workflow_bridge/scripts/github-remote-command.mjs"
          prepare
          --event "$GITHUB_EVENT_PATH"
          --request "$RUNNER_TEMP/design-workflow-request.json"
          --result "$RUNNER_TEMP/design-workflow-result.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify requester repository permission
        id: authorize
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node "$GITHUB_WORKSPACE/_design_workflow_bridge/scripts/authorize-remote-command.mjs"
          --event "$GITHUB_EVENT_PATH"
          --result "$RUNNER_TEMP/design-workflow-result.json"

      - name: Check out target project branch
        id: checkout
        if: steps.authorize.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.prepare.outputs.target-ref }}
          path: _design_workflow_project
          fetch-depth: 0

      - name: Verify command filesystem scope
        id: verify-paths
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: >-
          node "$GITHUB_WORKSPACE/_design_workflow_bridge/scripts/verify-remote-command-paths.mjs"
          --request "$RUNNER_TEMP/design-workflow-request.json"
          --result "$RUNNER_TEMP/design-workflow-result.json"
          --project "$GITHUB_WORKSPACE/_design_workflow_project"

      - name: Resolve pinned workflow runtime
        id: resolve-runtime
        if: steps.verify-paths.outcome == 'success'
        continue-on-error: true
        env:
          BRIDGE_REPOSITORY: ${{ job.workflow_repository }}
          BRIDGE_REVISION: ${{ job.workflow_sha }}
        run: >-
          node "$GITHUB_WORKSPACE/_design_workflow_bridge/scripts/resolve-remote-toolkit.mjs"
          --project "$GITHUB_WORKSPACE/_design_workflow_project"
          --bridge-repository "$BRIDGE_REPOSITORY"
          --bridge-revision "$BRIDGE_REVISION"
          --result "$RUNNER_TEMP/design-workflow-result.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Check out pinned workflow runtime
        id: runtime-checkout
        if: steps.resolve-runtime.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.resolve-runtime.outputs.toolkit-repository }}
          ref: ${{ steps.resolve-runtime.outputs.toolkit-revision }}
          path: _design_workflow_runtime
          persist-credentials: false

      - name: Execute canonical design-workflow command
        id: execute-command
        if: steps.runtime-checkout.outcome == 'success'
        continue-on-error: true
        env:
          TOOLKIT_REPOSITORY: ${{ steps.resolve-runtime.outputs.toolkit-repository }}
          TOOLKIT_REVISION: ${{ steps.resolve-runtime.outputs.toolkit-revision }}
        run: >-
          node "$GITHUB_WORKSPACE/_design_workflow_bridge/scripts/github-remote-command.mjs"
          execute
          --request "$RUNNER_TEMP/design-workflow-request.json"
          --result "$RUNNER_TEMP/design-workflow-result.json"
          --project "$GITHUB_WORKSPACE/_design_workflow_project"
          --cli "$GITHUB_WORKSPACE/_design_workflow_runtime/cli/design-workflow.mjs"
          --toolkit-repository "$TOOLKIT_REPOSITORY"
          --toolkit-revision "$TOOLKIT_REVISION"

      - name: Report result on command issue
        id: report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node "$GITHUB_WORKSPACE/_design_workflow_bridge/scripts/github-remote-command.mjs"
          report
          --event "$GITHUB_EVENT_PATH"
          --result "$RUNNER_TEMP/design-workflow-result.json"
          --prepare-outcome "${{ steps.prepare.outcome }}"
          --checkout-outcome "${{ steps.checkout.outcome }}"
          --execute-outcome "${{ steps.execute-command.outcome }}"

      - name: Fail closed when execution did not succeed
        if: >-
          always() &&
          (steps.prepare.outcome != 'success' ||
           steps.authorize.outcome != 'success' ||
           steps.checkout.outcome != 'success' ||
           steps.verify-paths.outcome != 'success' ||
           steps.resolve-runtime.outcome != 'success' ||
           steps.runtime-checkout.outcome != 'success' ||
           steps.execute-command.outcome != 'success' ||
           steps.report.outcome != 'success')
        run: exit 1
